<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Committed 60 — Altea Winnipeg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --frame:#0A0907; --surface:#15130F; --surface2:#1E1B16;
  --border:#332D24; --border-soft:#2A2620;
  --bronze:#7A6B57; --bronze2:#93826A; --bronze-bright:#B89B6E;
  --gold:#C9A86A; --cream:#EFE8D8; --text:#E9E3D6; --muted:#8F887C;
  --t-strength:#C9A86A; --t-shred:#C2705A; --t-longevity:#8FA98F; --t-endurance:#7E96B8;
  --pad:5vmin;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;}
body{font-family:'Archivo','Segoe UI',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--pad);}

/* header */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:2vmin;flex-wrap:wrap;margin-bottom:1.4vmin;}
.wordmark{font-style:italic;font-weight:900;font-size:5.8vmin;letter-spacing:.02em;text-transform:uppercase;color:transparent;-webkit-text-stroke:.18vmin var(--cream);white-space:nowrap;}
.wordmark b{color:var(--cream);-webkit-text-stroke:0;font-weight:900;margin-left:.35em;}
.head-right{text-align:right;margin-left:auto;}
.club{font-weight:700;font-size:3vmin;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
.day{font-size:2.2vmin;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:.5vmin;}
.day b{color:var(--cream);}

/* slides */
.slides{position:relative;flex:1;min-height:0;}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex;flex-direction:column;}
.slide.on{opacity:1;}
.slide-title{font-style:italic;font-weight:800;font-size:4vmin;text-transform:uppercase;letter-spacing:.04em;color:var(--cream);margin-bottom:.7vmin;}
.slide-sub{font-size:2.2vmin;color:var(--muted);margin-bottom:1vmin;letter-spacing:.04em;}
.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;overflow:hidden;}

.bar{height:3vmin;background:var(--surface);border:1px solid var(--border-soft);border-radius:1.7vmin;overflow:hidden;position:relative;min-width:8vmin;}
.fill{height:100%;border-radius:1.7vmin;width:0;transition:width 1.4s cubic-bezier(.2,.7,.2,1);}

/* slide 1 — team race */
.race-row{padding:0.8vmin 0;}
.race-head{display:flex;align-items:center;gap:1.6vmin;flex-wrap:wrap;}
.race-head .race-caps{margin-left:auto;margin-top:0;}
.race-barwrap{display:flex;align-items:center;gap:2vmin;margin-top:0.6vmin;}
.race-barwrap .bar{flex:1;}
.race-team{display:flex;align-items:center;gap:1.4vmin;min-width:0;}
.chip{width:1.6vmin;height:1.6vmin;border-radius:50%;flex:0 0 auto;}
.race-name{font-style:italic;font-weight:800;font-size:3vmin;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;}
.race-meta{font-size:2vmin;color:var(--muted);margin-top:.3vmin;}
.race-caps{font-size:1.9vmin;color:var(--bronze-bright);margin-top:.3vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.race-pct{font-weight:700;font-size:3.2vmin;text-align:right;color:var(--cream);min-width:10vmin;}
.race-pct small{display:block;font-weight:400;font-size:1.7vmin;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:.2vmin;}

/* slide 2 — bonus board (auto-fits 4 or 5 teams) */
.bonus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(30vmin,44%),1fr));gap:2vmin;align-content:center;margin:auto 0;width:100%;}
.bonus-card{background:linear-gradient(165deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:2vmin;padding:2.4vmin 2.2vmin;display:flex;flex-direction:column;min-width:0;}
.bonus-card .tname{font-style:italic;font-weight:800;font-size:2.8vmin;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bonus-total{font-weight:700;font-size:7vmin;line-height:1;margin:1.6vmin 0 .5vmin;color:var(--cream);}
.bonus-lbl{font-size:1.7vmin;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:1.8vmin;}
.bk{display:flex;justify-content:space-between;gap:1vmin;font-size:2.1vmin;padding:.8vmin 0;border-top:1px solid var(--border-soft);color:var(--muted);}
.bk b{color:var(--cream);font-weight:600;}
.crown{font-size:1.7vmin;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:auto;padding-top:1.4vmin;}

/* slide 3 — leaders */
.lead-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:5vmin;align-content:center;height:100%;}
.lead-row{display:grid;grid-template-columns:max-content 1fr max-content max-content;align-items:center;gap:1.8vmin;padding:0.7vmin .4vmin;border-bottom:1px solid var(--border-soft);min-width:0;}
.lead-rank{font-style:italic;font-weight:900;font-size:2.5vmin;color:var(--bronze-bright);min-width:4.2vmin;}
.lead-row.top .lead-rank{color:var(--gold);}
.lead-club{color:var(--muted);font-weight:400;font-size:2.1vmin;}
.lead-name{font-weight:600;font-size:2.3vmin;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.lead-team{font-size:1.7vmin;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:.5vmin 1.2vmin;border-radius:2vmin;text-align:center;border:1px solid var(--border-soft);white-space:nowrap;}
.lead-n{font-weight:700;font-size:2.4vmin;text-align:right;color:var(--cream);white-space:nowrap;}
.lead-n small{font-size:1.5vmin;color:var(--muted);font-weight:400;margin-left:.4vmin;}

/* slide 4 — interclub */
.ic-row{display:grid;grid-template-columns:minmax(20vmin,28vmin) 1fr max-content;align-items:center;gap:2.4vmin;padding:1.7vmin 0;}
.ic-club{font-style:italic;font-weight:800;font-size:3.2vmin;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ic-stats{text-align:right;min-width:14vmin;}
.ic-stats .line1{font-weight:700;font-size:3vmin;color:var(--cream);white-space:nowrap;}
.ic-stats .line2{font-size:2vmin;color:var(--muted);margin-top:.3vmin;white-space:nowrap;}

/* slide — finisher wall */
.wall{position:relative;flex:1;min-height:0;overflow:hidden;width:100%;}
.wall-list{display:flex;flex-direction:column;gap:1vmin;will-change:transform;}
.wall.scrolling::after{content:'';position:absolute;left:0;right:0;bottom:0;height:9vmin;background:linear-gradient(180deg,rgba(0,0,0,0),var(--bg));pointer-events:none;}
.wall.scrolling::before{content:'';position:absolute;left:0;right:0;top:0;height:3vmin;background:linear-gradient(0deg,rgba(0,0,0,0),var(--bg));pointer-events:none;z-index:1;}
.fin-row{display:flex;align-items:center;gap:1.8vmin;background:var(--surface);border:1px solid var(--border-soft);border-radius:1.4vmin;padding:1.5vmin 2.2vmin;flex:none;}
.fin-row.newest{border-color:var(--gold);}
.fin-dot{width:1.5vmin;height:1.5vmin;border-radius:50%;flex:none;}
.fin-name{font-weight:600;font-size:2.5vmin;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fin-new{font-size:1.5vmin;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#000;background:var(--gold);border-radius:.7vmin;padding:.35vmin 1vmin;flex:none;}
.fin-date{margin-left:auto;font-size:1.8vmin;color:var(--muted);letter-spacing:.06em;white-space:nowrap;flex:none;}
.fin-team{flex:none;font-size:1.7vmin;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid;border-radius:.9vmin;padding:.5vmin 1.5vmin;white-space:nowrap;}
.fin-count{float:right;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}

/* registration mode */
.reg-row{display:grid;grid-template-columns:1fr max-content;align-items:center;gap:2.4vmin;padding:1.9vmin 0;border-bottom:1px solid var(--border-soft);}
.reg-count{font-weight:700;font-size:5.4vmin;color:var(--cream);line-height:1;text-align:right;min-width:14vmin;}
.reg-count small{display:block;font-size:1.6vmin;color:var(--muted);font-weight:400;letter-spacing:.14em;text-transform:uppercase;margin-top:.3vmin;}
.countdown{font-style:italic;font-weight:900;font-size:2.6vmin;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;}

/* footer */
.foot{display:flex;align-items:center;justify-content:space-between;gap:2vmin;margin-top:1.2vmin;}
.dots{display:flex;gap:1.4vmin;}
.dot{width:7vmin;height:.7vmin;border-radius:.35vmin;background:var(--border);transition:background .4s;}
.dot.on{background:var(--gold);}
.tag{font-size:1.8vmin;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:right;}

.preview{position:fixed;top:1.4vmin;right:1.4vmin;font-size:1.5vmin;letter-spacing:.18em;text-transform:uppercase;color:#000;background:var(--gold);padding:.6vmin 1.2vmin;border-radius:.8vmin;font-weight:700;z-index:99;}

/* portrait: stack within rows, single leader column */
@media (orientation:portrait){
  .race-row{grid-template-columns:1fr max-content;}
  .race-team{grid-column:1 / -1;}
  .race-row .bar{grid-column:1;}
  .lead-grid{grid-template-columns:1fr;}
  .ic-row{grid-template-columns:1fr max-content;}
  .ic-club{grid-column:1 / -1;}
  .ic-row .bar{grid-column:1;}
  .tag{display:none;}
}
</style>
</head>
<body>
<div class="preview">Preview — Sample Data</div>
<div class="stage">
  <div class="head">
    <div class="wordmark">Committed<b>60</b></div>
    <div class="head-right">
      <div class="club" id="club"></div>
      <div class="day">Day <b id="dayN"></b> of <span id="dayT"></span></div>
    </div>
  </div>
  <div class="slides" id="slides"></div>
  <div class="foot">
    <div class="dots" id="dots"></div>
    <div class="tag">40 Workouts · 60 Days · One Club</div>
  </div>
</div>

<script>
const SAMPLE = {"club": "Altea Winnipeg", "day": 11, "total_days": 60, "teams": {"Strength": {"members": 96, "avg": 3.1, "pct": 7.7, "finished": 2, "bonus": 89, "dealers": 18, "rx": 29, "master": 8, "social": 14, "captains": ["Tiffany A.", "Samara M."]}, "Shred": {"members": 105, "avg": 2.9, "pct": 7.2, "finished": 1, "bonus": 110, "dealers": 17, "rx": 23, "master": 12, "social": 8, "captains": ["Jenna G.", "Aleksia D."]}, "Longevity": {"members": 82, "avg": 3.0, "pct": 7.6, "finished": 3, "bonus": 118, "dealers": 29, "rx": 36, "master": 8, "social": 18, "captains": ["YuJie B.", "Lex M."]}, "Endurance": {"members": 106, "avg": 3.3, "pct": 8.2, "finished": 2, "bonus": 128, "dealers": 27, "rx": 23, "master": 8, "social": 12, "captains": ["Gabe M.", "Eric S."]}}, "leaders": [{"name": "Marilyn M.", "team": "Endurance", "workouts": 23, "bonus": 0}, {"name": "Manal A.", "team": "Shred", "workouts": 22, "bonus": 0}, {"name": "Paula N.", "team": "Longevity", "workouts": 21, "bonus": 0}, {"name": "Wanda J.", "team": "Strength", "workouts": 18, "bonus": 0}, {"name": "Elizabeth J.", "team": "Shred", "workouts": 18, "bonus": 0}, {"name": "Hang N.", "team": "Longevity", "workouts": 18, "bonus": 0}, {"name": "Kari G.", "team": "Strength", "workouts": 16, "bonus": 0}, {"name": "Sushma S.", "team": "Strength", "workouts": 15, "bonus": 0}, {"name": "Stacey W.", "team": "Endurance", "workouts": 15, "bonus": 0}, {"name": "Kalie M.", "team": "Endurance", "workouts": 14, "bonus": 2}, {"name": "Alex V.", "team": "Shred", "workouts": 14, "bonus": 0}, {"name": "Bryce B.", "team": "Strength", "workouts": 13, "bonus": 3}], "allleaders": [{"name": "Maya R.", "club": "OTT", "team": "Shred", "workouts": 24}, {"name": "Marilyn M.", "club": "WPG", "team": "Endurance", "workouts": 23}, {"name": "Manal A.", "club": "WPG", "team": "Shred", "workouts": 22}, {"name": "Liam C.", "club": "LV", "team": "Strength", "workouts": 22}, {"name": "Priya S.", "club": "AVT YV", "team": "Longevity", "workouts": 22}, {"name": "Paula N.", "club": "WPG", "team": "Longevity", "workouts": 21}, {"name": "Dario F.", "club": "W6", "team": "Endurance", "workouts": 21}, {"name": "Anne-Marie L.", "club": "OTT", "team": "Sport Performance", "workouts": 21}, {"name": "Kofi A.", "club": "LV", "team": "Shred", "workouts": 20}, {"name": "Jess W.", "club": "W6", "team": "Sport Performance", "workouts": 19}, {"name": "Hana K.", "club": "AVT YV", "team": "Endurance", "workouts": 19}, {"name": "Wanda J.", "club": "WPG", "team": "Strength", "workouts": 18}], "total_signups": 389, "interclub": [{"club": "Winnipeg", "signups": 389, "avgpct": 7.7}, {"club": "Ottawa", "signups": 412, "avgpct": 24.5}, {"club": "Liberty Village", "signups": 389, "avgpct": 29.1}, {"club": "West 6", "signups": 356, "avgpct": 22.3}, {"club": "AVANT Yorkville", "signups": 248, "avgpct": 31.6}]};

/* CONFIG — editable */
const CONFIG = {
  slideSeconds: 20,
  wallSeconds: 35,   /* Finisher Wall stays up longer so the scroll can play out */
  leadersShown: {landscape: 20, portrait: 16},
  dates: {            // YYYY-MM-DD, local time
    regOpen:  '2026-06-15',
    regClose: '2026-06-22',
    start:    '2026-06-29',
    end:      '2026-08-27',
    awardsLabel: 'Awards Ceremony — September 2026'
  },
  teamColors: {Strength:'var(--t-strength)', Shred:'var(--t-shred)', Longevity:'var(--t-longevity)', Endurance:'var(--t-endurance)', 'Sport Performance':'#C25A5A', Pickleball:'#A98FC9'},
  bonusLabels: {dealers:"Dealer's Choice", rx:'Rx Scans', master:'Masterclass', social:'Socials'}
};

/* ---- date logic ---- */
const d0 = s => new Date(s+'T00:00:00');
const today = new Date(); today.setHours(0,0,0,0);
const urlMode = new URLSearchParams(location.search).get('mode'); // reg | live | final (preview overrides)
let MODE;
if (urlMode) MODE = urlMode;
else if (today < d0(CONFIG.dates.start)) MODE = 'reg';
else if (today > d0(CONFIG.dates.end)) MODE = 'final';
else MODE = 'live';
const dayNum = Math.min(60, Math.max(1, Math.round((today - d0(CONFIG.dates.start))/86400000) + 1));
const daysToKickoff = Math.max(0, Math.round((d0(CONFIG.dates.start) - today)/86400000));
const regOpenNow = today >= d0(CONFIG.dates.regOpen) && today <= d0(CONFIG.dates.regClose);

/* ---- per-club data loader ----
   Screen URL picks its club:  ?club=wpg | w6 | ott | lv | avtyv
   Loads data/<club>.json written by c60_daily.py. With no ?club= (or if the
   file is missing / opened locally), it falls back to the embedded SAMPLE so
   the preview still renders. */
const _params = new URLSearchParams(location.search);
const _club = (_params.get('club') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const _badge = document.querySelector('.preview');
async function boot(){
  let DATA = SAMPLE;
  if (_club){
    try{
      const resp = await fetch('data/' + _club + '.json', {cache:'no-store'});
      if (resp.ok){ DATA = await resp.json(); if (_badge) _badge.remove(); }
      else if (_badge){ _badge.textContent = 'Sample — data/' + _club + '.json not found'; }
    } catch(e){ if (_badge){ _badge.textContent = 'Sample — data load failed'; } }
  }
  render(DATA);
}

function render(DATA){
document.getElementById('club').textContent = DATA.club;
const dayEl = document.querySelector('.day');
if (MODE==='reg') dayEl.innerHTML = '<span class="countdown">'+(daysToKickoff>0 ? 'Kickoff in '+daysToKickoff+' day'+(daysToKickoff===1?'':'s') : 'Kickoff today')+'</span>';
else if (MODE==='final') dayEl.innerHTML = '<b>Final standings</b>';
else dayEl.innerHTML = 'Day <b>'+(urlMode?DATA.day:dayNum)+'</b> of '+DATA.total_days;

const tc = t => CONFIG.teamColors[t] || 'var(--gold)';
const teams = Object.entries(DATA.teams);
const isPortrait = () => window.matchMedia('(orientation:portrait)').matches;

/* ---- live/final slides ---- */
const s1 = [...teams].sort((a,b)=>b[1].pct-a[1].pct).map(([t,v])=>`
  <div class="race-row">
    <div class="race-head">
      <span class="chip" style="background:${tc(t)}"></span>
      <div class="race-name" style="color:${tc(t)}">Team ${t}</div>
      ${(v.captains&&v.captains.length)?`<div class="race-caps">Captains: ${v.captains.join(" · ")}</div>`:""}
    </div>
    <div class="race-meta">${v.members} members · ${v.finished} finished</div>
    <div class="race-barwrap">
      <div class="bar"><div class="fill" data-w="${v.pct}" style="background:linear-gradient(90deg,${tc(t)},var(--cream))"></div></div>
      <div class="race-pct">${v.pct}%</div>
    </div>
  </div>`).join('');

const maxBonus = Math.max(...teams.map(([,v])=>v.bonus));
const s2 = '<div class="bonus-grid">'+[...teams].sort((a,b)=>b[1].bonus-a[1].bonus).map(([t,v])=>`
  <div class="bonus-card" style="${v.bonus===maxBonus?'border-color:var(--gold);':''}">
    <div class="tname" style="color:${tc(t)}">Team ${t}</div>
    <div class="bonus-total">${v.bonus}</div>
    <div class="bonus-lbl">Bonus entries</div>
    ${Object.entries(CONFIG.bonusLabels).map(([k,l])=>`<div class="bk">${l}<b>${v[k]}</b></div>`).join('')}
    ${v.bonus===maxBonus?'<div class="crown">★ Leading the bonus race</div>':''}
  </div>`).join('')+'</div>';

function leadersHTML(){
  const n = isPortrait() ? CONFIG.leadersShown.portrait : CONFIG.leadersShown.landscape;
  return '<div class="lead-grid">'+DATA.leaders.slice(0,n).map((m,i)=>`
    <div class="lead-row ${i<3?'top':''}">
      <div class="lead-rank">${String(i+1).padStart(2,'0')}</div>
      <div class="lead-name">${m.name}</div>
      <div class="lead-team" style="color:${tc(m.team)};border-color:${tc(m.team)}">${m.team}</div>
      <div class="lead-n">${m.workouts}<small>/ 40</small></div>
    </div>`).join('')+'</div>';
}
function allLeadersHTML(){
  const n = isPortrait() ? CONFIG.leadersShown.portrait : CONFIG.leadersShown.landscape;
  return '<div class="lead-grid">'+DATA.allleaders.slice(0,n).map((m,i)=>`
    <div class="lead-row ${i<3?'top':''}">
      <div class="lead-rank">${String(i+1).padStart(2,'0')}</div>
      <div class="lead-name">${m.name} <span class="lead-club">(${m.club})</span></div>
      <div class="lead-team" style="color:${tc(m.team)};border-color:${tc(m.team)}">${m.team}</div>
      <div class="lead-n">${m.workouts}<small>/ 40</small></div>
    </div>`).join('')+'</div>';
}
function finWallHTML(){
  const fs = DATA.finishers || [];
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const age = d => Math.round((t0 - new Date(d+'T00:00:00')) / 86400000);
  const lbl = d => { const a = age(d);
    return a<=0 ? 'Today' : a===1 ? 'Yesterday' : new Date(d+'T00:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'}); };
  return '<div class="wall"><div class="wall-list">'+fs.map((f,i)=>`
    <div class="fin-row${i===0?' newest':''}">
      <span class="fin-dot" style="background:${tc(f.team)}"></span>
      <span class="fin-name">${f.name}</span>
      ${age(f.date)<=1?'<span class="fin-new">New</span>':''}
      <span class="fin-date">${lbl(f.date)}</span>
      <span class="fin-team" style="color:${tc(f.team)};border-color:${tc(f.team)}">${f.team}</span>
    </div>`).join('')+'</div></div>';
}
function startWall(){
  const wall = document.querySelector('.wall'); if (!wall) return;
  const list = wall.querySelector('.wall-list');
  if (list.scrollHeight <= wall.clientHeight + 1) return;  /* fits on screen — no scroll */
  if (!wall.dataset.dup){ list.innerHTML += list.innerHTML; wall.dataset.dup = '1'; wall.classList.add('scrolling'); }
  if (wall.dataset.anim) return;
  wall.dataset.anim = '1';
  let y = 0, last = performance.now();
  const vmin = () => Math.min(innerWidth, innerHeight) / 100;
  (function tick(now){
    const dt = (now - last) / 1000; last = now;
    y += 3.2 * vmin() * dt;              /* scroll speed: vmin per second */
    const half = list.scrollHeight / 2;
    if (y >= half) y -= half;
    list.style.transform = 'translateY(' + (-y) + 'px)';
    requestAnimationFrame(tick);
  })(performance.now());
}
const maxPct = Math.max(...DATA.interclub.map(c=>c.avgpct));
const s4 = [...DATA.interclub].sort((a,b)=>b.avgpct-a.avgpct).map((c,i)=>`
  <div class="ic-row">
    <div class="ic-club" style="color:${i===0?'var(--gold)':'var(--cream)'}">${c.club}</div>
    <div class="bar"><div class="fill" data-w="${100*c.avgpct/Math.max(maxPct,1)}" style="background:linear-gradient(90deg,${i===0?'var(--gold)':'var(--bronze)'},var(--cream))"></div></div>
    <div class="ic-stats"><div class="line1">${c.avgpct}% · ${c.signups}</div><div class="line2">avg progress · committed</div></div>
  </div>`).join('');

/* ---- registration slides ---- */
const maxSign = Math.max(...teams.map(([,v])=>v.members));
const r1 = [...teams].sort((a,b)=>b[1].members-a[1].members).map(([t,v])=>`
  <div class="reg-row">
    <div class="race-team"><span class="chip" style="background:${tc(t)}"></span>
      <div style="min-width:0"><div class="race-name" style="color:${tc(t)}">Team ${t}</div>
      ${(v.captains&&v.captains.length)?`<div class="race-caps">Captains: ${v.captains.join(" · ")}</div>`:""}</div></div>
    <div class="reg-count">${v.members}<small>committed</small></div>
  </div>`).join('');
const maxClubSign = Math.max(...DATA.interclub.map(c=>c.signups));
const r2 = [...DATA.interclub].sort((a,b)=>b.signups-a.signups).map((c,i)=>`
  <div class="ic-row">
    <div class="ic-club" style="color:${i===0?'var(--gold)':'var(--cream)'}">${c.club}</div>
    <div class="bar"><div class="fill" data-w="${100*c.signups/Math.max(maxClubSign,1)}" style="background:linear-gradient(90deg,${i===0?'var(--gold)':'var(--bronze)'},var(--cream))"></div></div>
    <div class="ic-stats"><div class="line1">${c.signups}</div><div class="line2">committed</div></div>
  </div>`).join('');

/* ---- slide sets per mode ---- */
const fmt = s => new Date(s+'T00:00:00').toLocaleDateString('en-CA',{month:'long',day:'numeric'});
let slides;
if (MODE==='reg'){
  const regSub = regOpenNow ? 'Registration closes '+fmt(CONFIG.dates.regClose)+' — pick your team'
                            : (today<d0(CONFIG.dates.regOpen) ? 'Registration opens '+fmt(CONFIG.dates.regOpen) : 'Registration closed — kickoff '+fmt(CONFIG.dates.start));
  slides = [
    {t:'The Team Draft', s:regSub, h:()=>r1}
  ];
} else {
  const finalTag = MODE==='final' ? ' — '+CONFIG.dates.awardsLabel : '';
  /* Finisher Wall slots in 2nd, only once the club has 10+ finishers */
  const fins = DATA.finishers || [];
  slides = [
    {t:'Club Leaders', s:'Most workouts completed — '+DATA.club, h:leadersHTML},
    ...(fins.length >= 10 ? [{t:'The Finisher Wall',
        s:'40 workouts. Done. Every '+DATA.club+' finisher.',
        h:finWallHTML, secs:CONFIG.wallSeconds}] : []),
    {t:(MODE==='final'?'Final — ':'')+'The Team Race', s:'Average progress toward 40 workouts per member'+finalTag, h:()=>s1},
    {t:'The Bonus Board', s:"Dealer's Choice · Rx Scans · Masterclasses · Socials", h:()=>s2},
    {t:'All-Club Leaders', s:'Top individuals across every club', h:allLeadersHTML}
  ];
}

const wrap = document.getElementById('slides'), dotsEl = document.getElementById('dots');
slides.forEach((sl)=>{
  const d = document.createElement('div');
  d.className='slide';
  d.innerHTML=`<div class="slide-title">${sl.t}</div><div class="slide-sub">${sl.s}</div><div class="content">${sl.h()}</div>`;
  wrap.appendChild(d);
  const dot=document.createElement('div'); dot.className='dot'; dotsEl.appendChild(dot);
});
let cur=0;
const els=[...wrap.children], dots=[...dotsEl.children];
function show(i){
  els.forEach((e,j)=>e.classList.toggle('on',j===i));
  dots.forEach((e,j)=>e.classList.toggle('on',j===i));
  els[i].querySelectorAll('.fill').forEach(f=>{f.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width=f.dataset.w+'%'));});
}
show(0);
requestAnimationFrame(()=>startWall());   /* wall exists off-screen; start its scroll once laid out */
(function next(){
  setTimeout(()=>{cur=(cur+1)%slides.length;show(cur);next();},
    (slides[cur].secs || CONFIG.slideSeconds)*1000);
})();
window.matchMedia('(orientation:portrait)').addEventListener('change',()=>{
  if (MODE!=='reg'){
    const li = slides.findIndex(s=>s.h===leadersHTML), ai = slides.findIndex(s=>s.h===allLeadersHTML);
    if (li>=0) els[li].querySelector('.content').innerHTML = leadersHTML();
    if (ai>=0) els[ai].querySelector('.content').innerHTML = allLeadersHTML();
  }
});
}  /* end render */

boot();
</script>
</body>
</html>
